Copy files

  gam user copy drivefile >>>folder/file ID<<< recursive depth N parentid >>>Folder/drive ID<<<
  
    N - liczba określająca jak głęboko ma szukać plików


File Info
   gam user >>username<< show filelist query 'title="filename/foldername"' id
   
   output:
    Owner,id
    username,file_id

Ownership Claim

ownership claim
gam <UserTypeEntity> claim ownership <DriveFileEntity> [skipids <DriveFileEntity>] [skipusers <UserTypeEntity>] [subdomains <DomainNameEntity>] [includetrashed] [writerscantshare] [preview] [filepath] [todrive [<ToDriveAttributes>]]

